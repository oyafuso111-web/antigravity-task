<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Task</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="logo">
        <span class="logo-icon">🚀</span>
        <span class="logo-text">Antigravity Task</span>
      </div>
      <span class="badge">Gmail連携</span>
    </header>

    <!-- Logged-out state -->
    <div id="login-section" class="section" style="display: none;">
      <p class="description">
        Gmailのメールからワンクリックで<br>タスクを登録できます。
      </p>
      <button id="login-btn" class="btn btn-primary">
        <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Googleでログイン
      </button>
      <p class="hint">タスクアプリと同じアカウントでログインしてください</p>
    </div>

    <!-- Logged-in state -->
    <div id="user-section" class="section" style="display: none;">
      <div class="user-info">
        <div class="user-avatar" id="user-avatar">U</div>
        <div class="user-details">
          <div class="user-name" id="user-name">—</div>
          <div class="user-email" id="user-email">—</div>
        </div>
        <div class="status-dot connected" id="status-dot" title="接続中"></div>
      </div>
      <div class="stats">
        <p class="stats-text">✅ Gmailでメールを開くと「📋 タスク登録」ボタンが表示されます</p>
      </div>
      <button id="logout-btn" class="btn btn-secondary">ログアウト</button>
    </div>

    <!-- Setup instructions -->
    <div id="setup-section" class="section" style="display: none;">
      <div class="setup-box">
        <h3>⚠️ 初回セットアップ</h3>
        <p>Supabaseにリダイレクト先URLの登録が必要です：</p>
        <code id="redirect-url" class="redirect-url">—</code>
        <button id="copy-url-btn" class="btn btn-small">URLをコピー</button>
        <ol class="setup-steps">
          <li>Supabase Dashboard → Authentication → URL Configuration</li>
          <li>「Redirect URLs」に上記URLを追加</li>
          <li>保存後、もう一度ログインしてください</li>
        </ol>
      </div>
    </div>

    <footer class="popup-footer">
      <span class="version">v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
